name: Validate PBIP definitions

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - name: Run offline Python checks
        run: python -m unittest discover -s tools/tests -v
      - name: Validate project structure (Desktop TMDL parser is Windows-only)
        run: python tools/validate_project.py
