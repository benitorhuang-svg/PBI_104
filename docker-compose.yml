services:
  postgres:
    image: postgres:16-alpine
    container_name: pbi104_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PBI104_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${PBI104_POSTGRES_DB:-jobwant_104}
      POSTGRES_USER: ${PBI104_POSTGRES_USER:-pbi_admin}
      POSTGRES_PASSWORD: ${PBI104_POSTGRES_PASSWORD:?Set PBI104_POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/sql/init_postgres_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PBI104_POSTGRES_USER:-pbi_admin} -d ${PBI104_POSTGRES_DB:-jobwant_104}"]
      interval: 10s
      timeout: 5s
      retries: 5

  address-geocoder:
    build:
      context: ../WGS84_TWD97
      dockerfile: Dockerfile
    image: wgs84-twd97-geospatial:dev
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      ADDRESS_DB_PATH: /data/source/database.sqlite
      ADDRESS_DB_READ_ONLY: 'true'
      COMPANY_DB_PATH: /data/source/server/database.sqlite
      COMPANY_DB_READ_ONLY: 'true'
    ports:
      - "127.0.0.1:${PBI104_GEOCODER_PORT:-3301}:3001"
    volumes:
      - type: bind
        source: ../WGS84_TWD97
        target: /data/source
        read_only: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  etl-coordinator:
    profiles: [acquisition]
    image: pbi104-etl:local
    build:
      context: .
      dockerfile: tools/deployment/containers/Dockerfile.etl
    env_file: .env
    environment:
      PBI104_POSTGRES_HOST: postgres
      PBI104_POSTGRES_PORT: "5432"
      HTTP_PROXY: ${PBI104_HTTP_PROXY:-}
      HTTPS_PROXY: ${PBI104_HTTPS_PROXY:-}
      ALL_PROXY: ${PBI104_ALL_PROXY:-}
      http_proxy: ${PBI104_HTTP_PROXY:-}
      https_proxy: ${PBI104_HTTPS_PROXY:-}
      all_proxy: ${PBI104_ALL_PROXY:-}
      NO_PROXY: ${PBI104_NO_PROXY:-postgres,address-geocoder,localhost,127.0.0.1}
      no_proxy: ${PBI104_NO_PROXY:-postgres,address-geocoder,localhost,127.0.0.1}
    volumes:
      - ./data/104:/app/data/104
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - tools.acquisition.platforms.jobwant_104.distributed.coordinator
      - --depth
      - "2"
      - --pagesize
      - "30"
      - --delay
      - ${PBI104_CAPTURE_DELAY_SECONDS:-0.8}
      - --workers
      - ${PBI104_CAPTURE_WORKERS:-3}
    restart: "no"

  etl-worker:
    profiles: [acquisition]
    image: pbi104-etl:local
    build:
      context: .
      dockerfile: tools/deployment/containers/Dockerfile.etl
    env_file: .env
    environment:
      PBI104_POSTGRES_HOST: postgres
      PBI104_POSTGRES_PORT: "5432"
      HTTP_PROXY: ${PBI104_HTTP_PROXY:-}
      HTTPS_PROXY: ${PBI104_HTTPS_PROXY:-}
      ALL_PROXY: ${PBI104_ALL_PROXY:-}
      http_proxy: ${PBI104_HTTP_PROXY:-}
      https_proxy: ${PBI104_HTTPS_PROXY:-}
      all_proxy: ${PBI104_ALL_PROXY:-}
      NO_PROXY: ${PBI104_NO_PROXY:-postgres,address-geocoder,localhost,127.0.0.1}
      no_proxy: ${PBI104_NO_PROXY:-postgres,address-geocoder,localhost,127.0.0.1}
    volumes:
      - ./data/104:/app/data/104
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - tools.acquisition.platforms.jobwant_104.distributed.worker
      - --delay
      - ${PBI104_CAPTURE_DELAY_SECONDS:-0.8}
      - --poll-seconds
      - "5"
      - --idle-exit-seconds
      - "20"
    restart: "no"

volumes:
  pgdata:
    driver: local
    name: pbi104_pgdata
