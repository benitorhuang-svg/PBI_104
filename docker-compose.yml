services:
  postgres:
    image: postgres:16-alpine
    container_name: pbi104_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pbi_104
      POSTGRES_USER: pbi_admin
      POSTGRES_PASSWORD: pbi_password_local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/sql/init_postgres_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbi_admin -d pbi_104"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
